name: Android build and release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'dist/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile, test, and lint
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 repository secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/acbl.keystore"
          echo "ACBL_KEYSTORE_PATH=$RUNNER_TEMP/acbl.keystore" >> "$GITHUB_ENV"
      - name: Assign increasing app version
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build signed APK
        run: bash gradlew assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
      - name: Verify signing identity
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/signature.txt"
          grep -F '156e22a417ff40a1c49f685ef3e1322b2540e68ed218d53738a3aa6857dd1580' "$RUNNER_TEMP/signature.txt"
      - name: Prepare APK and update manifest
        run: python3 .github/scripts/prepare_release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ACBLTracker-android.apk dist/update.json dist/ACBLTracker-android.apk.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/ACBLTracker-android.apk dist/update.json dist/ACBLTracker-android.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ACBL Tracker $VERSION_NAME" --notes 'Install the APK over your existing app to keep your roster and saved scores. Future updates are available from App updates in the app menu.' --latest
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/acbl.keystore"
